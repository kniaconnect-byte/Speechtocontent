<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Speech to Content — by Kniaconnect</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#98453e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S2Content">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase (compat build — simple to use from a single static file, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Library hook/template/kombinasi ide — edit di data.js, bukan di sini -->
<script src="./data.js"></script>

<style>
  :root{
    --bg:#fff8f5;
    --bg-deep:#f5ece7;
    --card:#ffffff;
    --ink:#1e1b18;
    --ink-soft:#554240;
    --accent:#98453e;
    --accent-dark:#6d2520;
    --accent-soft:#fadcd4;
    --secondary:#6f5953;
    --secondary-soft:#fadcd4;
    --outline-variant:#dac1be;
    --nav:#34302c;
    --shadow-soft:0 20px 44px -24px rgba(242,140,130,.55);
    --shadow-tight:0 10px 26px -16px rgba(242,140,130,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
  .icon{display:inline-flex;width:20px;height:20px;flex-shrink:0;}
  .icon svg{width:100%;height:100%;display:block;}
  .icon-lg{width:26px;height:26px;}
  .icon-xl{width:40px;height:40px;}

  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:96px;
  }
  .topbar{
    padding:26px 20px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .topbar .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .topbar h1{
    font-size:25px;
    font-weight:800;
    margin:2px 0 0;
    line-height:1.15;
    color:var(--ink);
  }
  .user-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border-radius:9999px;padding:5px 10px 5px 5px;
    box-shadow:var(--shadow-tight);
    flex-shrink:0;
  }
  .user-chip img{width:26px;height:26px;border-radius:50%;display:block;}
  .user-chip button{
    background:none;border:none;padding:2px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;
  }
  .screen{padding:0 20px 20px;}
  .card{
    background:var(--card);
    border-radius:2rem;
    padding:18px;
    box-shadow:var(--shadow-soft);
  }
  .card:focus-within{
    box-shadow:0 0 0 3px rgba(152,69,62,.16), var(--shadow-soft);
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-radius:9999px;
    font-size:13px;
    font-weight:600;
    background:var(--accent-soft);
    color:rgba(30,27,24,.78);
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .pill.active{
    background:var(--accent);
    color:#fff;
  }
  .pill-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .pill-row::-webkit-scrollbar{display:none;}
  textarea{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:15.5px;
    line-height:1.6;
    resize:none;
    outline:none;
    color:var(--ink);
  }
  textarea::placeholder{color:#b9a29d;}
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:9999px;
    padding:16px;
    font-size:15px;
    font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 16px 32px -14px rgba(152,69,62,.55);
  }
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-secondary{
    width:100%;
    background:var(--accent-soft);
    color:var(--ink);
    border:none;
    border-radius:9999px;
    padding:15px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-ghost{
    background:none;
    border:2px solid var(--outline-variant);
    border-radius:9999px;
    padding:12px;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }

  /* Big center record button */
  .record-zone{
    display:flex;flex-direction:column;align-items:center;
    padding:22px 0 26px;
  }
  .mic-btn-big{
    width:112px;height:112px;border-radius:50%;
    background:var(--accent);
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 18px 36px -12px rgba(152,69,62,.6);
    position:relative;
  }
  .mic-btn-big::after{
    content:'';
    position:absolute;inset:-10px;
    border-radius:50%;
    border:2px solid var(--accent-soft);
    opacity:0;
  }
  .mic-btn-big.recording{
    background:var(--accent-dark);
    animation:pulseBig 1.2s infinite;
  }
  @keyframes pulseBig{
    0%{box-shadow:0 0 0 0 rgba(109,37,32,.45), 0 18px 36px -12px rgba(152,69,62,.6);}
    70%{box-shadow:0 0 0 22px rgba(109,37,32,0), 0 18px 36px -12px rgba(152,69,62,.6);}
    100%{box-shadow:0 0 0 0 rgba(109,37,32,0), 0 18px 36px -12px rgba(152,69,62,.6);}
  }
  .record-label{
    margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    text-align:center;
  }

  .bottom-nav{
    position:fixed;
    bottom:16px;left:50%;transform:translateX(-50%);
    width:calc(100% - 32px);
    max-width:428px;
    background:var(--nav);
    border-radius:9999px;
    display:flex;
    padding:10px;
    z-index:40;
    box-shadow:0 18px 38px -16px rgba(30,27,24,.5);
  }
  .nav-item{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;
    border-radius:9999px;
    color:rgba(255,255,255,.5);
    cursor:pointer;
    font-size:10.5px;
    font-weight:600;
  }
  .nav-item .icon{width:19px;height:19px;}
  .nav-item.active{
    background:rgba(255,255,255,.14);
    color:#fff;
  }
  .idea-card{
    background:var(--card);
    border-radius:1.75rem;
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-tight);
  }
  .idea-card .txt{
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 10px;
    color:var(--ink);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:9999px;
  }
  .tag.muted{
    background:#efe6e2;
    color:var(--ink-soft);
  }
  .tag .icon{width:12px;height:12px;}
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty .icon{width:42px;height:42px;margin:0 auto 10px;color:#dac1be;}
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(30,20,18,.45);
    z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay .sheet{
    background:var(--bg);
    width:100%;
    max-width:460px;
    border-radius:2.5rem 2.5rem 0 0;
    max-height:88vh;
    overflow-y:auto;
    padding:20px 20px 28px;
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{
    width:40px;height:4px;background:var(--outline-variant);
    border-radius:99px;margin:0 auto 14px;
  }
  .field-label{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.05em;
    margin:16px 0 8px;
  }
  input[type=date], input[type=text]{
    width:100%;
    border:1.5px solid var(--outline-variant);
    border-radius:9999px;
    padding:12px 18px;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14.5px;
    outline:none;
    background:var(--bg);
    color:var(--ink);
  }
  input[type=date]:focus, input[type=text]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(152,69,62,.15);
  }
  .accordion-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px;
    cursor:pointer;
    font-weight:700;
    font-size:14.5px;
  }
  .accordion-head .icon{transition:transform .15s;color:var(--ink-soft);}
  .accordion-head.open .icon{transform:rotate(180deg);}
  .cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
  .hook-line{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;
    padding:11px 4px;
    border-top:1px solid var(--outline-variant);
    font-size:14px;
  }
  .use-btn{
    background:var(--accent);color:#fff;border:none;
    border-radius:9999px;padding:7px 14px;font-size:12px;font-weight:700;
    cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;gap:4px;
  }
  .use-btn .icon{width:13px;height:13px;}
  .template-card{
    background:var(--card);border-radius:1.5rem;padding:14px;margin-bottom:10px;
    box-shadow:var(--shadow-tight);
  }
  .toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
    background:var(--nav);color:#fff;padding:12px 20px;border-radius:9999px;
    font-size:13.5px;font-weight:600;z-index:200;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.4);
    animation:fadeIn .2s ease-out;
    display:flex;align-items:center;gap:8px;
  }
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .checklist-row{
    display:flex;align-items:flex-start;gap:10px;padding:9px 0;
    font-size:13px;line-height:1.4;color:var(--ink);
  }
  .checklist-row input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--accent);}
  .date-header{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    margin:20px 0 10px;text-transform:uppercase;letter-spacing:.04em;
  }
  .shuffle-box{
    background:var(--bg-deep);border-radius:1.5rem;padding:16px;margin-top:14px;
  }
  .close-x{
    position:absolute;top:16px;right:20px;
    background:rgba(30,27,24,.08);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);
  }

  /* Planner date-strip */
  .date-strip{
    display:flex;gap:10px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .date-chip{
    flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;
    width:58px;height:76px;
    border-radius:1.75rem;
    background:var(--accent-soft);
    color:var(--ink);
    cursor:pointer;
  }
  .date-chip .dow{font-size:10.5px;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.02em;}
  .date-chip .dom{font-size:23px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;line-height:1;}
  .date-chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85;margin-top:1px;}
  .date-chip.active{
    background:var(--accent);
    color:#fff;
    box-shadow:0 14px 28px -14px rgba(152,69,62,.55);
  }
  .date-chip.today{border:2px solid var(--accent);}
  .date-chip.active.today{border-color:transparent;}

  /* Footer */
  .app-footer{
    text-align:center;
    padding:28px 20px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:.65;
  }

  /* Login gate */
  .login-screen{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .login-screen img{width:120px;height:120px;border-radius:2rem;box-shadow:var(--shadow-soft);margin-bottom:22px;}
  .login-screen h1{font-size:24px;margin:0 0 6px;}
  .login-screen p{font-size:14px;color:var(--ink-soft);margin:0 0 26px;max-width:280px;line-height:1.5;}
  .google-btn{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1.5px solid var(--outline-variant);
    border-radius:9999px;padding:13px 22px;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;
    color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow-tight);
  }
  .login-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);max-width:260px;line-height:1.5;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>

const ICONS = {

function ico(name, cls=''){ return `<span class="icon ${cls}">${ICONS[name]||''}</span>`; }

/* ============ DATA ============ */
/* Library hook/template/checklist sekarang ada di file data.js (dimuat lewat <script src="./data.js"> di atas) */

const FORCE_FIREBASE_AUTH = urlParams.get('firebase') === '1';
const FIREBASE_ENABLED = FORCE_FIREBASE_AUTH || (
  window.location.protocol !== 'file:' &&
  firebaseConfig.apiKey &&
  firebaseConfig.apiKey.indexOf('YOUR_') !== 0
);
let fbAuth = null, fbDb = null, googleProvider = null;
if (FIREBASE_ENABLED) {
  try {
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    googleProvider = new firebase.auth.GoogleAuthProvider();

function pad2(n){ return String(n).padStart(2,'0'); }
function toDateStr(dt){ return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate()); }
function todayStr(){ return toDateStr(new Date()); }
function addDays(dateStr, n){
  const dt = new Date(dateStr+"T00:00:00");
  dt.setDate(dt.getDate()+n);
  return toDateStr(dt);
}
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
}
function uid(){ return 'idea_'+Date.now()+'_'+Math.floor(Math.random()*9999); }
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function readStoredIdeas(){
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get('kniaconnect-ideas', false);
      return res && res.value ? JSON.parse(res.value) : [];
    }
  } catch (e) {}
  try {
    const raw = localStorage.getItem('kniaconnect-ideas');
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

async function writeStoredIdeas(data){
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set('kniaconnect-ideas', JSON.stringify(data), false);
      return;
    }
  } catch (e) {}
  try {
    localStorage.setItem('kniaconnect-ideas', JSON.stringify(data));
  } catch (e) {
    throw e;
  }
}

/* ============ STORAGE (Firestore kalau login aktif, kalau nggak pakai storage lokal) ============ */
async function loadIdeas(){
  if (FIREBASE_ENABLED && userDocRef) {
    try {
      const snap = await userDocRef.get();
      ideas = (snap.exists && snap.data().ideas) || [];
    } catch(e){ ideas = []; showToast('Gagal ambil data dari cloud'); }
    return;
  }
  ideas = await readStoredIdeas();
}
async function persistIdeas(){
  if (FIREBASE_ENABLED && userDocRef) {
    try { await userDocRef.set({ideas}, {merge:true}); }
    catch(e){ showToast('Gagal nyimpen ke cloud'); }
    return;
  }
  try{
    await writeStoredIdeas(ideas);
  }catch(e){
    showToast('Gagal nyimpen, coba lagi ya');
  }
}

/* ============ TOAST ============ */
function showToast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

/* ============ AUTH FLOW ============ */
function initApp(){
  if (!FIREBASE_ENABLED || !fbAuth) { boot(); return; }
  fbAuth.onAuthStateChanged(async (user)=>{
    currentUser = user;
    if (user) {
      userDocRef = fbDb.collection('users').doc(user.uid);
      await boot();
    } else {
      userDocRef = null;
      renderLoginGate();
    }
  });
}
async function boot(){
  await loadIdeas();
  render();
}

/* ============ RENDER ROOT ============ */
function render(){
  const app = document.getElementById('app');
  let body = '';
  if(tab==='capture') body = renderCapture();
  else if(tab==='inbox') body = renderInbox();
  else if(tab==='planner') body = renderPlanner();
  else if(tab==='library') body = renderLibrary();

  app.innerHTML = body + renderFooter() + renderNav();

  // Always clear any previously-appended overlay before adding a fresh one —
  // otherwise repeated renders while the editor is open stack duplicate
  // sheets, and getElementById grabs the old (hidden) one instead of the
  // visible top one, making buttons look dead.
  document.querySelectorAll('body > .modal-overlay').forEach(el=>el.remove());

  if(editingId!==null){
    document.body.insertAdjacentHTML('beforeend', renderEditorSheet());
  }
  try{ attachEvents(); }catch(e){ console.error('attachEvents error:', e); }
}

/* ============ PLANNER SCREEN ============ */
function renderPlanner(){
  if(!plannerSelectedDate) plannerSelectedDate = todayStr();
  const today = todayStr();
  const scheduledDates = new Set(ideas.filter(i=>i.scheduledDate).map(i=>i.scheduledDate));

  let start = addDays(today, -3);
  let end = addDays(today, 13);
  if(plannerSelectedDate < start) start = plannerSelectedDate;
  if(plannerSelectedDate > end) end = plannerSelectedDate;
  const strip = [];
  for(let d=start; d<=end; d=addDays(d,1)) strip.push(d);

  const dayAbbr = d => new Date(d+"T00:00:00").toLocaleDateString('id-ID',{weekday:'short'});
  const dayNum = d => new Date(d+"T00:00:00").getDate();
  const list = ideas.filter(i=>i.scheduledDate===plannerSelectedDate);

  return `
  ${renderTopbar('Jadwal Konten', 'Planner')}
  <div class="screen">
    <div class="date-strip">
      ${strip.map(d=>`
        <div class="date-chip ${d===plannerSelectedDate?'active':''} ${d===today?'today':''}" data-pick-date="${d}">
          <span class="dow">${dayAbbr(d)}</span>
          <span class="dom">${dayNum(d)}</span>
          ${scheduledDates.has(d) ? `<span class="dot"></span>` : ''}
        </div>`).join('')}
    </div>

    <button class="btn-secondary" style="margin-bottom:16px;" id="addIdeaBtn" data-preset-date="${plannerSelectedDate}">${ico('plus')} Tambah ide buat ${fmtDate(plannerSelectedDate)}</button>

    ${list.length===0 ? `<div class="empty">${ico('calendar','icon-xl')}Belum ada ide di tanggal ini.<br>Tekan tombol di atas buat nambahin.</div>` :
      list.map(idea=>renderIdeaCard(idea)).join('')}
  </div>`;
}

/* ============ IDEA EDITOR ============ */
function openEditor(id, presetDate){
  editingId = id;
  if(id==='new'){
    draftIdea = {id:'new', text:'', format:'', hook:'', scheduledDate:presetDate||null, checklist:{}, createdAt:new Date().toISOString()};
  } else {
    const found = ideas.find(i=>i.id===id);
    draftIdea = JSON.parse(JSON.stringify(found));
  }
  pickerTarget = null;
  render();
}
function closeEditor(){
  editingId = null;
  draftIdea = null;
  pickerTarget = null;
  render();
}
function syncEditorFieldsIntoDraft(){
  if(!draftIdea) return;
  const t = document.getElementById('editIdeaText');
  const h = document.getElementById('editHookText');
  const d = document.getElementById('editDate');
  if(t) draftIdea.text = t.value;
  if(h) draftIdea.hook = h.value;
  if(d) draftIdea.scheduledDate = d.value || null;
}

/* ============ EVENTS ============ */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ tab = el.dataset.tab; render(); };
  });

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ fbAuth.signOut(); };

  const saveBtn = document.getElementById('saveIdeaBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const txt = document.getElementById('captureText').value.trim();
    if(!txt){ showToast('Tulis dulu ide-nya ya'); return; }
    ideas.push({id:uid(), text:txt, format:'', hook:'', scheduledDate:null, checklist:{}, createdAt:new Date().toISOString()});
    await persistIdeas();
    showToast('Ide tersimpan ke Inbox '+ico('check'));
    render();
  };
  const micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.onclick = ()=>toggleMic();
  const shuffleBtn = document.getElementById('shuffleBtn');
  if(shuffleBtn) shuffleBtn.onclick = ()=>{
    const t = AXIS_TOPIC[Math.floor(Math.random()*AXIS_TOPIC.length)];
    const a = AXIS_ANGLE[Math.floor(Math.random()*AXIS_ANGLE.length)];
    const f = AXIS_FORMAT[Math.floor(Math.random()*AXIS_FORMAT.length)];
    document.getElementById('shuffleResult').innerHTML = `<b>${t}</b> + <b>${a}</b> + <b>${f}</b>`;
  };

  const addIdeaBtn = document.getElementById('addIdeaBtn');
  if(addIdeaBtn) addIdeaBtn.onclick = ()=>openEditor('new', addIdeaBtn.dataset.presetDate || null);

  document.querySelectorAll('[data-pick-date]').forEach(el=>{
    el.onclick = ()=>{ plannerSelectedDate = el.dataset.pickDate; render(); };
  });

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>openEditor(el.dataset.open);
  });

  const closeEditorBtn = document.getElementById('closeEditor');
  if(closeEditorBtn) closeEditorBtn.onclick = closeEditor;
  const overlay = document.getElementById('editorOverlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='editorOverlay') closeEditor(); };

  document.querySelectorAll('[data-format]').forEach(el=>{
    el.onclick = ()=>{
      syncEditorFieldsIntoDraft();
      draftIdea.format = draftIdea.format===el.dataset.format ? '' : el.dataset.format;
      render();
    };
  });

  const pickHookBtn = document.getElementById('pickHookBtn');
  if(pickHookBtn) pickHookBtn.onclick = ()=>{
    syncEditorFieldsIntoDraft();
    if(!draftIdea.text.trim()){ showToast('Tulis idenya dulu ya, biar hook-nya bisa dirangkai'); return; }
    pickerTarget='hooks'; render();
  };
  const pickTemplateBtn = document.getElementById('pickTemplateBtn');
  if(pickTemplateBtn) pickTemplateBtn.onclick = ()=>{
    syncEditorFieldsIntoDraft();
    if(!draftIdea.text.trim()){ showToast('Tulis idenya dulu ya, biar hook-nya bisa dirangkai'); return; }
    pickerTarget='templates'; render();
  };

  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onchange = ()=>{
      draftIdea.checklist = draftIdea.checklist||{};
      draftIdea.checklist[el.dataset.check] = el.checked;
    };
  });

  const saveEditBtn = document.getElementById('saveEditBtn');
  if(saveEditBtn) saveEditBtn.onclick = async ()=>{
    syncEditorFieldsIntoDraft();
    const text = draftIdea.text.trim();
    if(!text){ showToast('Ide nggak boleh kosong'); return; }
    draftIdea.text = text;
    draftIdea.hook = draftIdea.hook.trim();
    const wasScheduled = !!draftIdea.scheduledDate;
    if(draftIdea.id==='new'){
      draftIdea.id = uid();
      ideas.push(draftIdea);
    } else {
      const i = ideas.findIndex(x=>x.id===draftIdea.id);
      ideas[i] = draftIdea;
    }
    await persistIdeas();
    showToast(wasScheduled ? 'Ide dijadwalkan '+ico('check') : 'Tersimpan '+ico('check'));
    closeEditor();
  };

  const deleteBtn = document.getElementById('deleteIdeaBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    ideas = ideas.filter(i=>i.id!==editingId);
    await persistIdeas();
    showToast('Ide dihapus');
    closeEditor();
  };

  const closePicker = document.getElementById('closePicker');
  if(closePicker) closePicker.onclick = ()=>{ pickerTarget=null; render(); };
  const pOverlay = document.getElementById('pickerOverlay');
  if(pOverlay) pOverlay.onclick = (e)=>{ if(e.target.id==='pickerOverlay'){ pickerTarget=null; render(); } };

  document.querySelectorAll('[data-acc-picker]').forEach(el=>{
    el.onclick = ()=>{ const k='p'+el.dataset.accPicker; libAccordionOpen[k]=!libAccordionOpen[k]; render(); };
  });
  document.querySelectorAll('[data-use-hook]').forEach(el=>{
    el.onclick = ()=>{
      const payload = (draftIdea.text||'').trim();
      draftIdea.hook = el.dataset.useHook + (payload ? ('\n\n'+payload) : '');
      pickerTarget=null; render();
    };
  });
  document.querySelectorAll('[data-use-template]').forEach(el=>{
    el.onclick = ()=>{
      const payload = (draftIdea.text||'').trim();
      draftIdea.hook = el.dataset.useTemplate.replace('[X]', payload || '...');
      pickerTarget=null; render();
    };
  });

  document.querySelectorAll('[data-acc]').forEach(el=>{
    el.onclick = ()=>{ const k=el.dataset.acc; libAccordionOpen[k]=!libAccordionOpen[k]; render(); };
  });
  document.querySelectorAll('[data-copy-hook]').forEach(el=>{
    el.onclick = ()=>{
      const text = el.dataset.copyHook;
      navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
      showToast('Hook disalin '+ico('check'));
    };
  });

  const activeChip = document.querySelector('.date-chip.active');
  if(activeChip && typeof activeChip.scrollIntoView === 'function'){
    try{ activeChip.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){}
  }
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast('Rekam suara nggak didukung di browser ini — tulis manual aja ya');
    return;
  }
  const micBtn = document.getElementById('micBtn');
  const label = document.getElementById('recordLabel');
  if(recognizing){ recognition && recognition.stop(); return; }
  try{
    recognition = new SR();
    recognition.lang = 'id-ID';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onstart = ()=>{ recognizing=true; micBtn.classList.add('recording'); if(label) label.textContent='Lagi mendengarkan... tekan lagi buat stop'; };
    recognition.onerror = ()=>{
      recognizing=false; micBtn.classList.remove('recording');
      if(label) label.textContent='Tekan buat mulai rekam ide kamu';
      showToast('Rekaman gagal / izin mic ditolak — tulis manual aja ya');
    };
    recognition.onend = ()=>{ recognizing=false; micBtn.classList.remove('recording'); if(label) label.textContent='Tekan buat mulai rekam ide kamu'; };
    recognition.onresult = (e)=>{
      let finalText = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      }
      if(finalText){
        const ta = document.getElementById('captureText');
        ta.value = (ta.value ? ta.value+' ' : '') + finalText.trim();
      }
    };
    recognition.start();
  }catch(e){
    showToast('Rekam suara nggak bisa dipakai di sini — tulis manual aja ya');
  }
}

initApp();

  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
