<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Speech to Content — by Kniaconnect</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#98453e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S2Content">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Firebase (compat build — simple to use from a single static file, no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Library hook/template/kombinasi ide — edit di data.js, bukan di sini -->
<script src="./data.js"></script>

<style>
  :root{
    --bg:#fff8f5;
    --bg-deep:#f5ece7;
    --card:#ffffff;
    --ink:#1e1b18;
    --ink-soft:#554240;
    --accent:#98453e;
    --accent-dark:#6d2520;
    --accent-soft:#fadcd4;
    --secondary:#6f5953;
    --secondary-soft:#fadcd4;
    --outline-variant:#dac1be;
    --nav:#34302c;
    --shadow-soft:0 20px 44px -24px rgba(242,140,130,.55);
    --shadow-tight:0 10px 26px -16px rgba(242,140,130,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Plus Jakarta Sans',sans-serif;}
  .icon{display:inline-flex;width:20px;height:20px;flex-shrink:0;}
  .icon svg{width:100%;height:100%;display:block;}
  .icon-lg{width:26px;height:26px;}
  .icon-xl{width:40px;height:40px;}

  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:96px;
  }
  .topbar{
    padding:26px 20px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .topbar .eyebrow{
    font-size:12px;
    font-weight:600;
    letter-spacing:.06em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .topbar h1{
    font-size:25px;
    font-weight:800;
    margin:2px 0 0;
    line-height:1.15;
    color:var(--ink);
  }
  .user-chip{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border-radius:9999px;padding:5px 10px 5px 5px;
    box-shadow:var(--shadow-tight);
    flex-shrink:0;
  }
  .user-chip img{width:26px;height:26px;border-radius:50%;display:block;}
  .user-chip button{
    background:none;border:none;padding:2px;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;
  }
  .screen{padding:0 20px 20px;}
  .card{
    background:var(--card);
    border-radius:2rem;
    padding:18px;
    box-shadow:var(--shadow-soft);
  }
  .card:focus-within{
    box-shadow:0 0 0 3px rgba(152,69,62,.16), var(--shadow-soft);
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:9px 16px;
    border-radius:9999px;
    font-size:13px;
    font-weight:600;
    background:var(--accent-soft);
    color:rgba(30,27,24,.78);
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }
  .pill.active{
    background:var(--accent);
    color:#fff;
  }
  .pill-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .pill-row::-webkit-scrollbar{display:none;}
  textarea{
    width:100%;
    border:none;
    background:transparent;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:15.5px;
    line-height:1.6;
    resize:none;
    outline:none;
    color:var(--ink);
  }
  textarea::placeholder{color:#b9a29d;}
  .btn-primary{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:9999px;
    padding:16px;
    font-size:15px;
    font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 16px 32px -14px rgba(152,69,62,.55);
  }
  .btn-primary:disabled{opacity:.35;cursor:not-allowed;}
  .btn-secondary{
    width:100%;
    background:var(--accent-soft);
    color:var(--ink);
    border:none;
    border-radius:9999px;
    padding:15px;
    font-size:14.5px;
    font-weight:700;
    font-family:'Plus Jakarta Sans',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-ghost{
    background:none;
    border:2px solid var(--outline-variant);
    border-radius:9999px;
    padding:12px;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
    cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }

  /* Big center record button */
  .record-zone{
    display:flex;flex-direction:column;align-items:center;
    padding:22px 0 26px;
  }
  .mic-btn-big{
    width:112px;height:112px;border-radius:50%;
    background:var(--accent);
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 18px 36px -12px rgba(152,69,62,.6);
    position:relative;
  }
  .mic-btn-big::after{
    content:'';
    position:absolute;inset:-10px;
    border-radius:50%;
    border:2px solid var(--accent-soft);
    opacity:0;
  }
  .mic-btn-big.recording{
    background:var(--accent-dark);
    animation:pulseBig 1.2s infinite;
  }
  @keyframes pulseBig{
    0%{box-shadow:0 0 0 0 rgba(109,37,32,.45), 0 18px 36px -12px rgba(152,69,62,.6);}
    70%{box-shadow:0 0 0 22px rgba(109,37,32,0), 0 18px 36px -12px rgba(152,69,62,.6);}
    100%{box-shadow:0 0 0 0 rgba(109,37,32,0), 0 18px 36px -12px rgba(152,69,62,.6);}
  }
  .record-label{
    margin-top:14px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
    text-align:center;
  }

  .bottom-nav{
    position:fixed;
    bottom:16px;left:50%;transform:translateX(-50%);
    width:calc(100% - 32px);
    max-width:428px;
    background:var(--nav);
    border-radius:9999px;
    display:flex;
    padding:10px;
    z-index:40;
    box-shadow:0 18px 38px -16px rgba(30,27,24,.5);
  }
  .nav-item{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:8px 4px;
    border-radius:9999px;
    color:rgba(255,255,255,.5);
    cursor:pointer;
    font-size:10.5px;
    font-weight:600;
  }
  .nav-item .icon{width:19px;height:19px;}
  .nav-item.active{
    background:rgba(255,255,255,.14);
    color:#fff;
  }
  .idea-card{
    background:var(--card);
    border-radius:1.75rem;
    padding:16px;
    margin-bottom:12px;
    box-shadow:var(--shadow-tight);
  }
  .idea-card .txt{
    font-size:14.5px;
    line-height:1.5;
    margin:0 0 10px;
    color:var(--ink);
  }
  .tag{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:9999px;
  }
  .tag.muted{
    background:#efe6e2;
    color:var(--ink-soft);
  }
  .tag .icon{width:12px;height:12px;}
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
  }
  .empty .icon{width:42px;height:42px;margin:0 auto 10px;color:#dac1be;}
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(30,20,18,.45);
    z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal-overlay .sheet{
    background:var(--bg);
    width:100%;
    max-width:460px;
    border-radius:2.5rem 2.5rem 0 0;
    max-height:88vh;
    overflow-y:auto;
    padding:20px 20px 28px;
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{
    width:40px;height:4px;background:var(--outline-variant);
    border-radius:99px;margin:0 auto 14px;
  }
  .field-label{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    text-transform:uppercase;letter-spacing:.05em;
    margin:16px 0 8px;
  }
  input[type=date], input[type=text], input[type=password]{
    width:100%;
    border:1.5px solid var(--outline-variant);
    border-radius:9999px;
    padding:12px 18px;
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:14.5px;
    outline:none;
    background:var(--bg);
    color:var(--ink);
  }
  input[type=date]:focus, input[type=text]:focus, input[type=password]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 4px rgba(152,69,62,.15);
  }
  .accordion-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px;
    cursor:pointer;
    font-weight:700;
    font-size:14.5px;
  }
  .accordion-head .icon{transition:transform .15s;color:var(--ink-soft);}
  .accordion-head.open .icon{transform:rotate(180deg);}
  .cat-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;}
  .hook-line{
    display:flex;justify-content:space-between;align-items:center;
    gap:10px;
    padding:11px 4px;
    border-top:1px solid var(--outline-variant);
    font-size:14px;
  }
  .use-btn{
    background:var(--accent);color:#fff;border:none;
    border-radius:9999px;padding:7px 14px;font-size:12px;font-weight:700;
    cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;gap:4px;
  }
  .use-btn .icon{width:13px;height:13px;}
  .template-card{
    background:var(--card);border-radius:1.5rem;padding:14px;margin-bottom:10px;
    box-shadow:var(--shadow-tight);
  }
  .toast{
    position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
    background:var(--nav);color:#fff;padding:12px 20px;border-radius:9999px;
    font-size:13.5px;font-weight:600;z-index:200;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.4);
    animation:fadeIn .2s ease-out;
    display:flex;align-items:center;gap:8px;
  }
  @keyframes fadeIn{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  .checklist-row{
    display:flex;align-items:flex-start;gap:10px;padding:9px 0;
    font-size:13px;line-height:1.4;color:var(--ink);
  }
  .checklist-row input{width:18px;height:18px;flex-shrink:0;margin-top:1px;accent-color:var(--accent);}
  .date-header{
    font-size:13px;font-weight:700;color:var(--ink-soft);
    margin:20px 0 10px;text-transform:uppercase;letter-spacing:.04em;
  }
  .close-x{
    position:absolute;top:16px;right:20px;
    background:rgba(30,27,24,.08);
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink);
  }

  /* Planner date-strip */
  .date-strip{
    display:flex;gap:10px;overflow-x:auto;padding:4px 2px 16px;scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .date-chip{
    flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;
    width:58px;height:76px;
    border-radius:1.75rem;
    background:var(--accent-soft);
    color:var(--ink);
    cursor:pointer;
  }
  .date-chip .dow{font-size:10.5px;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.02em;}
  .date-chip .dom{font-size:23px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;line-height:1;}
  .date-chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85;margin-top:1px;}
  .date-chip.active{
    background:var(--accent);
    color:#fff;
    box-shadow:0 14px 28px -14px rgba(152,69,62,.55);
  }
  .date-chip.today{border:2px solid var(--accent);}
  .date-chip.active.today{border-color:transparent;}

  /* Footer */
  .app-footer{
    text-align:center;
    padding:28px 20px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:.65;
  }

  /* Login gate */
  .login-screen{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px;text-align:center;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  }
  .login-screen img{width:120px;height:120px;border-radius:2rem;box-shadow:var(--shadow-soft);margin-bottom:22px;}
  .login-screen h1{font-size:24px;margin:0 0 6px;}
  .login-screen p{font-size:14px;color:var(--ink-soft);margin:0 0 26px;max-width:280px;line-height:1.5;}
  .google-btn{
    display:flex;align-items:center;gap:10px;
    background:var(--card);border:1.5px solid var(--outline-variant);
    border-radius:9999px;padding:13px 22px;
    font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14.5px;
    color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow-tight);
  }
  .login-note{margin-top:16px;font-size:11.5px;color:var(--ink-soft);max-width:260px;line-height:1.5;}

  /* Pilihan AI / Template + pengaturan BYOK */
  .seg{
    display:flex;gap:4px;padding:4px;margin-top:12px;
    background:var(--bg-deep);border-radius:9999px;
  }
  .seg-btn{
    flex:1;border:none;background:transparent;cursor:pointer;
    border-radius:9999px;padding:10px 8px;
    font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .seg-btn .icon{width:15px;height:15px;}
  .seg-btn.active{
    background:var(--accent);color:#fff;
    box-shadow:0 8px 18px -10px rgba(152,69,62,.6);
  }
  .ai-note{font-size:12px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  .ai-note .icon{width:13px;height:13px;vertical-align:-2px;margin-right:2px;}
  .link-btn{
    background:none;border:none;padding:0;cursor:pointer;
    font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;
    color:var(--accent);text-decoration:underline;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:var(--card);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow-tight);flex-shrink:0;
  }
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .spinner{
    width:34px;height:34px;border-radius:50%;margin:0 auto 14px;
    border:3px solid var(--accent-soft);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-box{
    background:#fdecea;color:#7a2b22;border-radius:1.25rem;
    padding:14px 16px;font-size:13.5px;line-height:1.5;margin-bottom:12px;
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============ ICON LIBRARY (flat, custom-built — see chat note re: Flaticon) ============ */
const ICONS = {

  trash: `<svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7m-8 0 .8 12.1A2 2 0 0 0 9.8 21h4.4a2 2 0 0 0 2-1.9L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  close: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none"><path d="M8 10l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  copy: `<svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5" stroke="currentColor" stroke-width="2"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

function suggestHookCategory(text){
  const t = (text||'').toLowerCase();
  if(!t.trim()) return null;
  let bestIdx = null, bestScore = 0;
  HOOKS_60.forEach((cat, i)=>{
    const kws = cat.keywords || [];
    let score = 0;
    kws.forEach(k=>{ if(t.includes(k)) score++; });
    if(score > bestScore){ bestScore = score; bestIdx = i; }
  });

/* ============ AI HOOK — BYOK (Google AI Studio / Gemini API) ============
   API key milik user sendiri, disimpan HANYA di localStorage perangkat ini.
   Nggak pernah masuk Firestore / nggak dikirim ke server mana pun selain Google. */
const LS_AI_KEY = 'kniaconnect-gemini-key';
const LS_AI_MODEL = 'kniaconnect-gemini-model';
const LS_HOOK_MODE = 'kniaconnect-hook-mode';
const DEFAULT_GEMINI_MODEL = 'gemini-3.5-flash-lite';
const GEMINI_MODEL_SUGGESTIONS = ['gemini-3.5-flash-lite', 'gemini-3.8-flash'];
const AI_HOOK_COUNT = 5;

function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lsSet(k, v){
  try{
    if(v) localStorage.setItem(k, v); else localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function getApiKey(){ return lsGet(LS_AI_KEY); }
function getModel(){ return lsGet(LS_AI_MODEL) || DEFAULT_GEMINI_MODEL; }
function getHookMode(){ return lsGet(LS_HOOK_MODE) === 'ai' ? 'ai' : 'template'; }

function aiError(code, msg){ const e = new Error(msg); e.code = code; return e; }

function mapGeminiHttpError(status, data, model){
  const raw = (data && data.error && data.error.message) || '';
  const low = raw.toLowerCase();
  if(status === 400 && (low.includes('api key') || low.includes('api_key')))
    return aiError('key', 'API key-nya ditolak Google. Cek lagi ya, pastikan kesalin lengkap.');
  if(status === 401 || status === 403)
    return aiError('key', 'Akses ditolak. API key mungkin salah, dibatasi, atau belum aktif di AI Studio.');
  if(status === 404)
    return aiError('model', 'Model "' + model + '" nggak ditemukan. Coba ganti nama model di Pengaturan AI.');
  if(status === 429)
    return aiError('quota', 'Kuota API key kamu lagi habis atau terlalu banyak request. Tunggu sebentar terus coba lagi.');
  if(status >= 500)
    return aiError('server', 'Server Google lagi sibuk. Coba lagi sebentar lagi ya.');
  return aiError('other', 'Gagal generate (kode ' + status + ').' + (raw ? ' ' + raw.slice(0, 140) : ''));
}

function buildHookPrompt(ideaText, format){
  // Contoh gaya diambil dari library sendiri (data.js) biar nada hook-nya nyambung sama brand
  const refs = HOOKS_60.map(c => '- ' + c.name + ': "' + c.items[0] + '" / "' + (c.items[1] || c.items[0]) + '"').join('\n');
  const pats = VIRAL_TEMPLATES.map(t => '- ' + t.type + ': ' + t.tpl).join('\n');
  const system = [
    'Kamu copywriter konten video pendek berbahasa Indonesia.',
    'Tugasmu: menulis HOOK, yaitu kalimat pembuka di 1-3 detik pertama yang bikin orang berhenti scroll.',
    'Aturan:',
    '- Bahasa Indonesia santai sehari-hari (aku/kamu), kayak ngobrol sama teman.',
    '- Satu kalimat per hook, maksimal 15 kata.',
    '- Tanpa hashtag dan tanpa emoji.',
    '- Jangan mengarang angka, hasil, atau klaim yang nggak ada di ide.',
    '- Jangan menyalin contoh mentah-mentah; sesuaikan dengan isi ide.',
    '- Buat ' + AI_HOOK_COUNT + ' hook dengan sudut pandang yang beda-beda.',
    'Balas HANYA berupa JSON array berisi ' + AI_HOOK_COUNT + ' string, tanpa penjelasan lain.'
  ].join('\n');
  const user =
    'Ide konten:\n"""\n' + String(ideaText).slice(0, 1500) + '\n"""\n' +
    (format ? 'Format: ' + format + '\n' : '') +
    '\nContoh nada hook (referensi gaya saja):\n' + refs +
    '\n\nPola kalimat yang boleh dipakai sebagai kerangka:\n' + pats;
  return {system, user};
}

function cleanHookList(arr){
  const seen = new Set();
  const out = [];
  (arr || []).forEach(x => {
    if(typeof x !== 'string') return;
    const s = x.replace(/\s+/g, ' ').trim();
    if(s.length < 5 || s.length > 220) return;
    const k = s.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k);
    out.push(s);
  });
  return out.slice(0, AI_HOOK_COUNT + 1);
}

function parseHookList(text){
  let t = String(text || '').trim()
    .replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
  try{
    const j = JSON.parse(t);
    const arr = Array.isArray(j) ? j : (j && Array.isArray(j.hooks) ? j.hooks : null);
    if(arr) return cleanHookList(arr);
  }catch(e){}
  // Cadangan: kalau model balas teks biasa per baris
  return cleanHookList(t.split('\n').map(l =>
    l.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').replace(/^["“]+|["”,\s]+$/g, '')
  ));
}

async function generateHooksWithGemini(ideaText, format){
  const key = getApiKey();
  const model = getModel();
  const {system, user} = buildHookPrompt(ideaText, format);
  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
              encodeURIComponent(model) + ':generateContent';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let res;
  try{
    res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-goog-api-key': key},
      body: JSON.stringify({
        systemInstruction: {parts: [{text: system}]},
        contents: [{role: 'user', parts: [{text: user}]}],
        generationConfig: {responseMimeType: 'application/json'}
      }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === 'AbortError') throw aiError('timeout', 'AI kelamaan jawab. Coba lagi ya.');
    throw aiError('network', 'Nggak bisa nyambung ke Google. Cek internet kamu terus coba lagi.');
  }
  clearTimeout(timer);
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw mapGeminiHttpError(res.status, data, model);

  if(data && data.promptFeedback && data.promptFeedback.blockReason)
    throw aiError('blocked', 'Idemu ditahan filter keamanan Gemini. Coba ubah kalimatnya sedikit.');
  const cand = data && data.candidates && data.candidates[0];
  const parts = (cand && cand.content && cand.content.parts) || [];
  const text = parts.filter(p => p && !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  const hooks = parseHookList(text);
  if(!hooks.length) throw aiError('empty', 'AI nggak ngasih hasil yang bisa dipakai. Coba generate ulang.');
  return hooks;
}

  syncEditorFieldsIntoDraft();

  const myId = ++aiReqId;
  aiState = {status:'loading', hooks:[], error:'', code:''};
  pickerTarget = 'ai';
  render();
  try{
    const hooks = await generateHooksWithGemini(draftIdea.text, draftIdea.format);
    if(myId !== aiReqId) return;
    aiState = {status:'done', hooks, error:'', code:''};
  }catch(e){
    if(myId !== aiReqId) return;
    aiState = {status:'error', hooks:[], error:e.message || 'Gagal generate.', code:e.code || 'other'};
  }
  if(pickerTarget === 'ai' && draftIdea) render();
}

function renderPlanner(){
  if(!plannerSelectedDate) plannerSelectedDate = todayStr();
  const today = todayStr();
  const scheduledDates = new Set(ideas.filter(i=>i.scheduledDate).map(i=>i.scheduledDate));

  let start = addDays(today, -3);
  let end = addDays(today, 13);
  if(plannerSelectedDate < start) start = plannerSelectedDate;
  if(plannerSelectedDate > end) end = plannerSelectedDate;
  const strip = [];
  for(let d=start; d<=end; d=addDays(d,1)) strip.push(d);

  const dayAbbr = d => new Date(d+"T00:00:00").toLocaleDateString('id-ID',{weekday:'short'});
  const dayNum = d => new Date(d+"T00:00:00").getDate();
  const list = ideas.filter(i=>i.scheduledDate===plannerSelectedDate);

  return `
  ${renderTopbar('Jadwal Konten', 'Planner')}
  <div class="screen">
    <div class="date-strip">
      ${strip.map(d=>`
        <div class="date-chip ${d===plannerSelectedDate?'active':''} ${d===today?'today':''}" data-pick-date="${d}">
          <span class="dow">${dayAbbr(d)}</span>
          <span class="dom">${dayNum(d)}</span>
          ${scheduledDates.has(d) ? `<span class="dot"></span>` : ''}
        </div>`).join('')}
    </div>

    <button class="btn-secondary" style="margin-bottom:16px;" id="addIdeaBtn" data-preset-date="${plannerSelectedDate}">${ico('plus')} Tambah ide buat ${fmtDate(plannerSelectedDate)}</button>

    ${list.length===0 ? `<div class="empty">${ico('calendar','icon-xl')}Belum ada ide di tanggal ini.<br>Tekan tombol di atas buat nambahin.</div>` :
      list.map(idea=>renderIdeaCard(idea)).join('')}

}

/* ============ IDEA EDITOR ============ */
function openEditor(id, presetDate){
  editingId = id;
  if(id==='new'){
    draftIdea = {id:'new', text:'', format:'', hook:'', scheduledDate:presetDate||null, checklist:{}, createdAt:new Date().toISOString()};
  } else {
    const found = ideas.find(i=>i.id===id);
    draftIdea = JSON.parse(JSON.stringify(found));
  }
  pickerTarget = null;
  render();
}
function closeEditor(){
  aiReqId++; // batalin hasil AI yang masih jalan
  aiState = {status:'idle', hooks:[], error:'', code:''};
  editingId = null;
  draftIdea = null;
  pickerTarget = null;
  recommendedCatIndex = null;
  render();
}
function syncEditorFieldsIntoDraft(){
  if(!draftIdea) return;
  const t = document.getElementById('editIdeaText');
  const h = document.getElementById('editHookText');
  const d = document.getElementById('editDate');
  if(t) draftIdea.text = t.value;
  if(h) draftIdea.hook = h.value;
  if(d) draftIdea.scheduledDate = d.value || null;
}

function renderEditorSheet(){
  const idea = draftIdea;
  if(!idea) return '';
  if(pickerTarget) return renderHookPickerSheet();

  return `
  <div class="modal-overlay" id="editorOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="position:relative;">
        <div class="close-x" id="closeEditor">${ico('close')}</div>
        <h2 style="font-size:19px;margin:0 0 14px;">Atur Ide</h2>
      </div>

      <div class="field-label">Ide kamu</div>
      <div class="card" style="padding:12px;">
        <textarea id="editIdeaText" rows="3">${escapeHtml(idea.text)}</textarea>
      </div>

      <div class="field-label">Format</div>
      <div class="pill-row">
        ${FORMATS.map(f=>`<div class="pill ${idea.format===f?'active':''}" data-format="${f}">${f}</div>`).join('')}

      <div class="field-label">Hook</div>

      <div class="card" style="padding:12px;">
        <textarea id="editHookText" rows="3" placeholder="Tulis hook sendiri, atau pilih di bawah — nanti otomatis dirangkai jadi 1 hook utuh bareng ide di atas">${escapeHtml(idea.hook||'')}</textarea>

        <input type="date" id="editDate" value="${idea.scheduledDate||''}">

      <div style="display:flex;gap:10px;margin-top:18px;">
        ${idea.id!=='new' ? `<button class="btn-ghost" style="flex:1;color:#B23B2A;border-color:rgba(178,59,42,.3);" id="deleteIdeaBtn">${ico('trash')} Hapus</button>` : ''}
        <button class="btn-primary" style="flex:2;" id="saveEditBtn">Simpan</button>
      </div>
    </div>
  </div>`;
}

/* Pilihan cara bikin hook: AI (BYOK) atau Template */

  const mode = getHookMode();
  const hasKey = !!getApiKey();
  const seg = `
    <div class="seg">
      <button type="button" class="seg-btn ${mode==='ai'?'active':''}" data-hook-mode="ai">${ico('sparkle')} Pakai AI</button>
      <button type="button" class="seg-btn ${mode==='template'?'active':''}" data-hook-mode="template">${ico('book2')} Pakai Template</button>

  if(mode==='ai'){

      ? `${ico('key')} API key tersimpan di perangkat ini · <button type="button" class="link-btn" data-open-settings>Atur</button>`

/* Sheet hasil AI: loading / error / daftar hook */
function renderAiPickerSheet(){
  let inner = '';
  if(aiState.status==='loading'){
    inner = `
      <div style="text-align:center;padding:28px 10px 24px;">
        <div class="spinner"></div>
        <div style="font-weight:700;font-size:14.5px;">AI lagi meracik hook buat idemu...</div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;">Biasanya cuma beberapa detik.</div>
      </div>`;
  } else if(aiState.status==='error'){
    const needsSettings = aiState.code==='key' || aiState.code==='model';
    inner = `
      <div class="error-box">${escapeHtml(aiState.error)}</div>
      ${needsSettings ? `<button class="btn-primary" style="margin-bottom:10px;" data-open-settings="retry">${ico('key')} Cek API key &amp; model</button>` : ''}
      <button class="${needsSettings?'btn-secondary':'btn-primary'}" id="aiRegenBtn">${ico('sparkle')} Coba lagi</button>`;
  } else {
    inner = `
      <div style="font-size:12.5px;color:var(--ink-soft);margin:-4px 0 12px;line-height:1.5;">Pilih satu, nanti bisa kamu edit lagi dengan bahasamu sendiri.</div>
      ${aiState.hooks.map(h=>`
        <div class="template-card">
          <div style="font-size:14.5px;line-height:1.5;">${escapeHtml(h)}</div>
          <div style="margin-top:10px;display:flex;justify-content:flex-end;">
            <button class="use-btn" data-use-hook="${escapeHtml(h)}">Pakai</button>
          </div>
        </div>`).join('')}
      <button class="btn-secondary" style="margin-top:6px;" id="aiRegenBtn">${ico('shuffle')} Generate ulang</button>`;
  }
  return `
  <div class="modal-overlay" id="pickerOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div style="position:relative;">
        <div class="close-x" id="closePicker">${ico('close')}</div>
        <h2 style="font-size:18px;margin:0 0 14px;">Hook dari AI</h2>
      </div>
      ${inner}
    </div>
  </div>`;
}

/* ============ EVENTS ============ */
function attachEvents(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ tab = el.dataset.tab; render(); };
  });

  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.onclick = ()=>{ fbAuth.signOut(); };

  const saveBtn = document.getElementById('saveIdeaBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const txt = document.getElementById('captureText').value.trim();
    if(!txt){ showToast('Tulis dulu ide-nya ya'); return; }
    ideas.push({id:uid(), text:txt, format:'', hook:'', scheduledDate:null, checklist:{}, createdAt:new Date().toISOString()});
    await persistIdeas();
    showToast('Ide tersimpan ke Inbox '+ico('check'));
    render();
  };
  const micBtn = document.getElementById('micBtn');
  if(micBtn) micBtn.onclick = ()=>toggleMic();
  const addIdeaBtn = document.getElementById('addIdeaBtn');
  if(addIdeaBtn) addIdeaBtn.onclick = ()=>openEditor('new', addIdeaBtn.dataset.presetDate || null);

  document.querySelectorAll('[data-pick-date]').forEach(el=>{
    el.onclick = ()=>{ plannerSelectedDate = el.dataset.pickDate; render(); };
  });

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>openEditor(el.dataset.open);
  });

  const closeEditorBtn = document.getElementById('closeEditor');
  if(closeEditorBtn) closeEditorBtn.onclick = closeEditor;
  const overlay = document.getElementById('editorOverlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='editorOverlay') closeEditor(); };

  document.querySelectorAll('[data-format]').forEach(el=>{
    el.onclick = ()=>{
      syncEditorFieldsIntoDraft();
      draftIdea.format = draftIdea.format===el.dataset.format ? '' : el.dataset.format;
      render();
    };
  });

  const pickHookBtn = document.getElementById('pickHookBtn');
  if(pickHookBtn) pickHookBtn.onclick = ()=>{
    syncEditorFieldsIntoDraft();
    if(!draftIdea.text.trim()){ showToast('Tulis idenya dulu ya, biar hook-nya bisa dirangkai'); return; }
    showToast('Menganalisis idemu... '+ico('sparkle'));
    setTimeout(()=>{
      recommendedCatIndex = suggestHookCategory(draftIdea.text);
      libAccordionOpen = {};
      if(recommendedCatIndex!==null) libAccordionOpen['p'+recommendedCatIndex] = true;
      pickerTarget='hooks'; render();
    }, 450);
  };
  const pickTemplateBtn = document.getElementById('pickTemplateBtn');
  if(pickTemplateBtn) pickTemplateBtn.onclick = ()=>{
    syncEditorFieldsIntoDraft();
    if(!draftIdea.text.trim()){ showToast('Tulis idenya dulu ya, biar hook-nya bisa dirangkai'); return; }
    pickerTarget='templates'; render();
  };

  const saveEditBtn = document.getElementById('saveEditBtn');
  if(saveEditBtn) saveEditBtn.onclick = async ()=>{
    syncEditorFieldsIntoDraft();
    const text = draftIdea.text.trim();
    if(!text){ showToast('Ide nggak boleh kosong'); return; }
    draftIdea.text = text;
    draftIdea.hook = draftIdea.hook.trim();
    const wasScheduled = !!draftIdea.scheduledDate;
    if(draftIdea.id==='new'){
      draftIdea.id = uid();
      ideas.push(draftIdea);
    } else {
      const i = ideas.findIndex(x=>x.id===draftIdea.id);
      ideas[i] = draftIdea;
    }
    await persistIdeas();
    showToast(wasScheduled ? 'Ide dijadwalkan '+ico('check') : 'Tersimpan '+ico('check'));
    closeEditor();
  };

  const deleteBtn = document.getElementById('deleteIdeaBtn');
  if(deleteBtn) deleteBtn.onclick = async ()=>{
    ideas = ideas.filter(i=>i.id!==editingId);
    await persistIdeas();
    showToast('Ide dihapus');
    closeEditor();
  };

  const closePicker = document.getElementById('closePicker');
  if(closePicker) closePicker.onclick = ()=>{ pickerTarget=null; render(); };
  const pOverlay = document.getElementById('pickerOverlay');
  if(pOverlay) pOverlay.onclick = (e)=>{ if(e.target.id==='pickerOverlay'){ pickerTarget=null; render(); } };

  document.querySelectorAll('[data-acc-picker]').forEach(el=>{
    el.onclick = ()=>{ const k='p'+el.dataset.accPicker; libAccordionOpen[k]=!libAccordionOpen[k]; render(); };
  });
  document.querySelectorAll('[data-use-hook]').forEach(el=>{
    el.onclick = ()=>{
      const payload = (draftIdea.text||'').trim();
      draftIdea.hook = el.dataset.useHook + (payload ? ('\n\n'+payload) : '');
      pickerTarget=null; render();
    };
  });
  document.querySelectorAll('[data-use-template]').forEach(el=>{
    el.onclick = ()=>{
      const payload = (draftIdea.text||'').trim();
      draftIdea.hook = el.dataset.useTemplate.replace('[X]', payload || '...');
      pickerTarget=null; render();
    };
  });

  document.querySelectorAll('[data-acc]').forEach(el=>{
    el.onclick = ()=>{ const k=el.dataset.acc; libAccordionOpen[k]=!libAccordionOpen[k]; render(); };
  });
  document.querySelectorAll('[data-copy-hook]').forEach(el=>{
    el.onclick = ()=>{
      const text = el.dataset.copyHook;
      navigator.clipboard && navigator.clipboard.writeText(text).catch(()=>{});
      showToast('Hook disalin '+ico('check'));
    };
  });

  /* --- Pilihan AI / Template + BYOK --- */
  document.querySelectorAll('[data-hook-mode]').forEach(el=>{
    el.onclick = ()=>{
      syncEditorFieldsIntoDraft();
      lsSet(LS_HOOK_MODE, el.dataset.hookMode);
      render();
    };
  });
  const aiGenerateBtn = document.getElementById('aiGenerateBtn');
  if(aiGenerateBtn) aiGenerateBtn.onclick = ()=>startAiGenerate();
  const aiRegenBtn = document.getElementById('aiRegenBtn');
  if(aiRegenBtn) aiRegenBtn.onclick = ()=>startAiGenerate();

  document.querySelectorAll('[data-open-settings]').forEach(el=>{
    el.onclick = ()=>openSettings(el.dataset.openSettings==='retry');
  });
  const closeSettingsBtn = document.getElementById('closeSettings');
  if(closeSettingsBtn) closeSettingsBtn.onclick = closeSettings;
  const settingsOverlay = document.getElementById('settingsOverlay');
  if(settingsOverlay) settingsOverlay.onclick = (e)=>{ if(e.target.id==='settingsOverlay') closeSettings(); };

  const toggleKeyVis = document.getElementById('toggleKeyVis');
  if(toggleKeyVis) toggleKeyVis.onchange = ()=>{
    document.getElementById('apiKeyInput').type = toggleKeyVis.checked ? 'text' : 'password';
  };
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  if(saveSettingsBtn) saveSettingsBtn.onclick = ()=>{
    const key = (document.getElementById('apiKeyInput').value || '').replace(/\s+/g,'');
    const model = (document.getElementById('modelInput').value || '').trim();
    if(key.length < 20){ showToast('API key-nya kayaknya belum lengkap'); return; }
    const saved = lsSet(LS_AI_KEY, key);
    lsSet(LS_AI_MODEL, model && model !== DEFAULT_GEMINI_MODEL ? model : '');
    if(!saved){ showToast('Browser nggak mau nyimpen key (mode private?)'); return; }
    settingsOpen = false;
    showToast('API key tersimpan '+ico('check'));
    if(pendingGenerate){ pendingGenerate = false; startAiGenerate(); }
    else render();
  };
  const clearKeyBtn = document.getElementById('clearKeyBtn');
  if(clearKeyBtn) clearKeyBtn.onclick = ()=>{
    lsSet(LS_AI_KEY, '');
    settingsOpen = false;
    pendingGenerate = false;
    showToast('API key dihapus dari perangkat ini');
    render();
  };

  const activeChip = document.querySelector('.date-chip.active');
  if(activeChip && typeof activeChip.scrollIntoView === 'function'){
    try{ activeChip.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){}
  }
}
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    showToast('Rekam suara nggak didukung di browser ini — tulis manual aja ya');
    return;
  }
  const micBtn = document.getElementById('micBtn');
  const label = document.getElementById('recordLabel');
  if(recognizing){ recognition && recognition.stop(); return; }
  try{
    recognition = new SR();
    recognition.lang = 'id-ID';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.onstart = ()=>{ recognizing=true; micBtn.classList.add('recording'); if(label) label.textContent='Lagi mendengarkan... tekan lagi buat stop'; };
    recognition.onerror = ()=>{
      recognizing=false; micBtn.classList.remove('recording');
      if(label) label.textContent='Tekan buat mulai rekam ide kamu';
      showToast('Rekaman gagal / izin mic ditolak — tulis manual aja ya');
    };
    recognition.onend = ()=>{ recognizing=false; micBtn.classList.remove('recording'); if(label) label.textContent='Tekan buat mulai rekam ide kamu'; };
    recognition.onresult = (e)=>{
      let finalText = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      }
      if(finalText){
        const ta = document.getElementById('captureText');
        ta.value = (ta.value ? ta.value+' ' : '') + finalText.trim();
      }
    };
    recognition.start();
  }catch(e){
    showToast('Rekam suara nggak bisa dipakai di sini — tulis manual aja ya');
  }
}

/* ============ INIT ============ */
document.getElementById('app').innerHTML = `<div class="empty" style="padding-top:120px;">Memuat...</div>`;
initApp();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
